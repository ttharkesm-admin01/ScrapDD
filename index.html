<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ขายเศษวัสดุเหลือใช้ — TKF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14202c; --muted:#5d6e7d; --line:#ccd5dd; --line-soft:#e3e9ee;
  --paper:#eef1f4; --surface:#fff; --primary:#1b4965; --primary-ink:#fff;
  --draft:#6b7783; --wait:#a35a00; --check:#1f4fbf; --done:#1a7a3e; --back:#b3261e;
  --r:6px; --sp:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'IBM Plex Sans Thai',system-ui,sans-serif;
  background:var(--paper); color:var(--ink); font-size:15px; line-height:1.55;
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.hide{display:none !important}

/* ---------- ปุ่ม ---------- */
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:var(--r);
     cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--primary)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn-danger{color:var(--back);border-color:#e6c3c0}
.btn-sm{padding:5px 10px;font-size:14px}

/* ---------- เข้าสู่ระบบ ---------- */
#login{min-height:100dvh;display:grid;place-items:center;padding:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px;width:100%;max-width:380px}
.card h1{font-size:20px;font-weight:600;margin:0 0 4px}
.card p.sub{margin:0 0 22px;color:var(--muted);font-size:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.field input:focus{border-color:var(--primary)}
.msg{padding:9px 12px;border-radius:var(--r);font-size:14px;margin-bottom:14px}
.msg-err{background:#fdf0ef;color:var(--back);border:1px solid #f0d2cf}
.msg-ok{background:#eef7f1;color:var(--done);border:1px solid #cfe6d8}

/* ---------- โครงหน้า ---------- */
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.bar{max-width:1280px;margin:0 auto;padding:11px var(--sp);display:flex;align-items:center;gap:14px}
.brand{font-weight:600;font-size:16px;margin-right:auto}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.who{font-size:13px;color:var(--muted);text-align:right}
.who b{display:block;color:var(--ink);font-weight:500}
main{max-width:1280px;margin:0 auto;padding:var(--sp)}

/* ---------- แท็บสถานะ ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px;scrollbar-width:thin}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 14px;
     cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:14px}
.tab[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab .n{background:var(--paper);color:var(--ink);border-radius:10px;padding:0 7px;font-size:12px}
.tab[aria-selected="true"] .n{background:rgba(255,255,255,.22);color:#fff}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input[type=search],.toolbar select{padding:8px 11px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.toolbar input[type=search]{flex:1;min-width:180px}
.spacer{flex:1}

/* ---------- ตาราง ---------- */
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:13px;background:#f7f9fa;position:sticky;top:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:#f5f8fa}
tbody tr:last-child td{border-bottom:none}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-weight:500;margin-bottom:4px}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.pill:empty{display:none}
.pill[data-s="ร่าง"]{color:var(--draft)}
.pill[data-s="รอตรวจสอบ"]{color:var(--wait)}
.pill[data-s="รออนุมัติ"]{color:var(--check)}
.pill[data-s="สมบูรณ์"]{color:var(--done)}
.pill[data-s="ตีกลับ"]{color:var(--back)}

/* ---------- หน้าเอกสาร ---------- */
#editor{position:fixed;inset:0;background:var(--paper);z-index:40;overflow-y:auto}
.ed-bar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.ed-body{max-width:900px;margin:0 auto;padding:var(--sp) var(--sp) 90px}
.section{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:14px}
.section > h3{margin:0;border-bottom:1px solid var(--line-soft)}
.sechead{width:100%;display:flex;align-items:center;gap:10px;padding:12px 16px;background:none;border:0;
  font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-align:left;border-radius:8px 8px 0 0}
.sechead .count{margin-left:auto;font-weight:400;font-size:13px;color:var(--muted)}
.sechead .count.full{color:var(--done)}
.sechead .chev{color:var(--muted);display:inline-block}
.section.collapsed > h3{border-bottom:0}
.section.collapsed .section-body{display:none}
.section.collapsed .chev{transform:rotate(-90deg)}
.section-body{padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.grid.photos{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.req{color:var(--back)}
.hint{font-size:12px;color:var(--muted);margin-top:4px}

/* ---------- ช่องรูป ---------- */
.photo-wrap{position:relative}
.photo{width:100%;padding:0;border:1px dashed var(--line);border-radius:var(--r);aspect-ratio:4/3;
  display:grid;place-items:center;cursor:pointer;background:#f7f9fa;overflow:hidden;
  text-align:center;color:var(--muted);font-size:13px}
.photo img{width:100%;height:100%;object-fit:cover}
.photo.filled{border-style:solid}
.photo:disabled{cursor:default;opacity:1}
.ph-act{position:absolute;top:6px;right:6px;display:flex;gap:4px}
.ph-act button{background:rgba(20,32,44,.82);color:#fff;border:none;border-radius:4px;
  min-height:26px;padding:0 8px;cursor:pointer;line-height:26px;font-size:13px}
.ph-act button:hover{background:rgba(20,32,44,.95)}
.busy{position:absolute;inset:0;background:rgba(255,255,255,.88);display:grid;place-items:center;
  font-size:13px;border-radius:var(--r);color:var(--ink)}

.footbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:11px var(--sp);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;z-index:6}
.signs{font-size:13px;color:var(--muted);line-height:1.9}
.signs b{color:var(--ink);font-weight:500}

/* ---------- lightbox ---------- */
#lightbox{position:fixed;inset:0;background:rgba(10,16,22,.92);z-index:60;display:grid;place-items:center;padding:20px}
#lightbox img{max-width:100%;max-height:88vh;object-fit:contain}
#lightbox button{position:absolute;top:16px;right:16px}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:var(--toast-bottom,24px);transform:translateX(-50%);background:var(--ink);
  color:#fff;padding:10px 18px;border-radius:20px;z-index:80;font-size:14px;max-width:90vw;text-align:center}

.age{font-size:12px;color:var(--muted);display:block}

@media (max-width:640px){
  main{padding:12px}
  .who span{display:none}
  .footbar .btn{flex:1;justify-content:center}
  .grid.photos{grid-template-columns:1fr 1fr;gap:10px}
  .photo{aspect-ratio:1}
  .section-body{padding:12px}

  /* ตารางรายการ → การ์ดต่อแถว (เฉพาะหน้าแรก ไม่แตะตารางในหน้าตั้งค่า) */
  #list thead{display:none}
  #list table,#list tbody,#list tr,#list td{display:block;width:100%}
  #list tr{position:relative;padding:13px 14px;border-bottom:1px solid var(--line-soft)}
  #list td{border:none;padding:0;white-space:normal}
  #list .c-id{font-weight:600;padding-right:104px;margin-bottom:2px}
  #list .c-status{position:absolute;top:13px;right:14px;text-align:right}
  #list .c-field,#list .c-meta{font-size:14px;color:var(--muted);display:flex;gap:8px}
  #list .c-field::before{content:attr(data-label);flex:none;min-width:92px;font-size:13px}
  /* ช่องแรกถัดจากเลขที่ = ข้อมูลหลักของแถว ให้เด่นกว่าช่องอื่น
     (ใช้ .c-id + .c-field เพราะ :first-of-type จะไปจับ <td> ใบแรกซึ่งเป็นเลขที่) */
  #list .c-id + .c-field{color:var(--ink);font-size:15px}
  #list .c-id + .c-field::before{color:var(--muted)}
}
@media (prefers-reduced-motion:no-preference){
  #editor{animation:slideup .18s ease-out}
  @keyframes slideup{from{transform:translateY(12px);opacity:.4}to{transform:none;opacity:1}}
}
</style>
</head>
<body>

<!-- เข้าสู่ระบบ -->
<div id="login">
  <form class="card" id="loginForm" autocomplete="on">
    <h1>ขายเศษวัสดุเหลือใช้</h1>
    <p class="sub">โรงงานธารเกษม — ฝ่ายบริการสำนักงาน</p>
    <div id="loginMsg"></div>
    <div class="field">
      <label for="u">ชื่อผู้ใช้</label>
      <input id="u" name="username" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="p">รหัสผ่าน</label>
      <input id="p" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center" id="loginBtn">เข้าสู่ระบบ</button>
  </form>
</div>

<!-- หน้าหลัก -->
<div id="app" class="hide">
  <header>
    <div class="bar">
      <div class="brand">ขายเศษวัสดุเหลือใช้ <small>โรงงานธารเกษม</small></div>
      <div class="who"><b id="whoName"></b><span id="whoRole"></span></div>
      <button class="btn btn-sm" id="btnSettings" hidden>ตั้งค่า</button>
      <button class="btn btn-sm" id="btnLogout">ออก</button>
    </div>
  </header>

  <main>
    <div class="tabs" id="tabs" role="tablist"></div>

    <div class="toolbar">
      <input type="search" id="q" placeholder="ค้นหา เลขที่ / ซัพพลายเออร์ / ทะเบียนรถ">
      <select id="fYear"></select>
      <select id="fMonth"></select>
      <span class="spacer"></span>
      <button class="btn btn-primary" id="btnNew">+ สร้างรายการ</button>
    </div>

    <div class="tablewrap"><div id="list"></div></div>
  </main>
</div>

<!-- หน้าเอกสาร -->
<div id="editor" class="hide" role="dialog" aria-modal="true" aria-labelledby="edTitle">
  <div class="ed-bar">
    <div class="bar">
      <button class="btn btn-sm" id="edClose">← กลับ</button>
      <div class="brand" id="edTitle" style="font-size:15px"></div>
      <span class="pill" id="edStatus"></span>
    </div>
  </div>
  <div class="ed-body" id="edBody"></div>
  <div class="footbar" id="edFoot"></div>
</div>

<script src="app.js"></script>
</body>
</html>
