<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ขายเศษวัสดุเหลือใช้ — TKF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14202c; --muted:#5d6e7d; --line:#ccd5dd; --line-soft:#e3e9ee;
  --paper:#eef1f4; --surface:#fff; --primary:#1b4965; --primary-ink:#fff;
  --draft:#6b7783; --wait:#a35a00; --check:#1f4fbf; --done:#1a7a3e; --back:#b3261e;
  --r:6px; --sp:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--paper);color:var(--ink);
  font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.hide{display:none !important}
svg{flex:0 0 auto}

/* ---------- ปุ่ม ---------- */
.btn{border:1px solid var(--line);background:var(--surface);min-height:44px;padding:0 14px;border-radius:var(--r);
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--primary)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);font-weight:600}
.btn-danger{color:var(--back);border-color:#e6c3c0}
.btn-sm{min-height:36px;padding:0 10px;font-size:14px}
.btn-icon{width:40px;min-height:40px;padding:0}
.btn-big{min-height:52px;font-size:17px;font-weight:600;width:100%}

/* ---------- เข้าสู่ระบบ ---------- */
#login{min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--surface)}
.loginbox{width:100%;max-width:380px;display:flex;flex-direction:column;gap:22px}
.mark{width:44px;height:44px;border-radius:var(--r);background:var(--primary);display:grid;place-items:center}
.loginbox h1{font-size:24px;font-weight:600;line-height:1.35;margin:10px 0 2px}
.field{display:flex;flex-direction:column;gap:6px}
.field > span{font-size:14px;font-weight:500}
.field input,.field select,.field textarea{min-height:50px;padding:10px 12px;font-size:16px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--surface);width:100%}
.field textarea{min-height:88px;resize:vertical}
.msg-err{display:flex;align-items:center;gap:8px;background:#fdf2f1;border:1px solid var(--back);
  border-radius:var(--r);padding:10px 12px;font-size:13px;color:var(--back)}

/* ---------- โครงหน้าหลัก ---------- */
#app{min-height:100dvh;display:flex;flex-direction:column;max-width:980px;margin:0 auto;background:var(--paper)}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:14px var(--sp) 10px;
  display:flex;flex-direction:column;gap:12px;position:sticky;top:0;z-index:5}
.toprow{display:flex;align-items:center;gap:12px}
.toprow h1{font-size:19px;font-weight:600;margin:0}
.sub{font-size:13px;color:var(--muted)}
.seg{display:flex;gap:6px;background:var(--paper);border-radius:var(--r);padding:4px}
.seg button{flex:1;min-height:40px;border:0;border-radius:4px;cursor:pointer;font-weight:500;background:transparent;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,32,44,.1)}
.searchrow{display:flex;gap:8px}
.search{flex:1;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:var(--r);
  display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--surface)}
.search input{flex:1;min-width:0;height:42px;border:0;background:transparent;font-size:15px}
.search input:focus{outline:none}
.topbar select{min-height:44px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:0 8px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:40px;padding:0 12px;border-radius:var(--r);cursor:pointer;display:flex;
  align-items:center;gap:7px;font-size:14px;font-weight:500;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.tab[aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.tab .dot{width:8px;height:8px;border-radius:4px;background:currentColor}
.tab .n{font-weight:600}
main{flex:1;padding:var(--sp);display:flex;flex-direction:column;gap:12px}
.footcreate{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px var(--sp) 16px}

/* ---------- การ์ดใบงาน ---------- */
.doc{text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--draft);border-radius:var(--r);padding:12px;display:flex;gap:12px;width:100%;font:inherit;color:inherit}
.doc:hover{border-color:var(--primary)}
.doc .thumb{width:72px;height:72px;flex:0 0 auto;border-radius:var(--r);background:#d5dce2;border:1px solid var(--line);
  display:flex;align-items:flex-end;justify-content:flex-end;padding:4px;overflow:hidden;position:relative}
.doc .thumb span{font-size:10px;background:var(--surface);border-radius:3px;padding:1px 4px;position:relative;z-index:1}
.doc .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.doc .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.doc .line1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.doc .id{font-size:16px;font-weight:600}
.doc .main{font-size:14px;line-height:1.45}
.doc .meta{font-size:13px;color:var(--muted);line-height:1.45}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;
  border:1px solid currentColor;border-radius:var(--r);padding:2px 7px}
.pill .dot{width:7px;height:7px;border-radius:4px;background:currentColor}
.age{font-size:12px;font-weight:500}
.pbar{flex:1;height:5px;border-radius:3px;background:var(--line-soft);overflow:hidden}
.pbar > i{display:block;height:100%;background:var(--primary)}
.prow{display:flex;align-items:center;gap:8px}
.prow span{font-size:12px;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;
  display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.empty b{font-weight:500;font-size:15px}
.empty p{margin:0;font-size:13px;color:var(--muted)}

/* ---------- แดชบอร์ด ---------- */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters select{min-height:44px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:0 8px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;
  display:flex;flex-direction:column;gap:12px}
.panel h3{margin:0;font-size:15px;font-weight:600}
.panel .head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;
  display:flex;flex-direction:column;gap:4px;min-height:104px}
.kpi .label{font-size:13px;color:var(--muted);line-height:1.35}
.kpi .val{font-size:26px;font-weight:600;line-height:1.1}
.kpi .unit{font-size:13px;color:var(--muted);font-weight:400}
.kpi .knote{font-size:12px;line-height:1.4}
.bars{display:flex;align-items:flex-end;gap:8px;height:190px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.bars .col b{font-size:12px;font-weight:500}
.bars .col i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--primary)}
.bars .col small{font-size:12px;color:var(--muted)}
.mix{display:flex;gap:3px;height:14px;border-radius:7px;overflow:hidden}
.legend{display:flex;align-items:center;gap:9px;font-size:14px}
.legend .sw{width:9px;height:9px;border-radius:5px;flex:0 0 auto}
.legend .nm{flex:1}
.legend .pc{color:var(--muted)}
.legend .n{font-weight:600;min-width:26px;text-align:right}
.hrow{display:flex;align-items:center;gap:10px}
.hrow .lab{width:96px;flex:0 0 auto;font-size:13px;color:var(--muted)}
.hrow .track{flex:1;height:20px;background:var(--paper);border-radius:4px;overflow:hidden}
.hrow .track > i{display:block;height:100%}
.hrow .n{width:26px;text-align:right;font-weight:600}
.rank{display:flex;flex-direction:column;gap:5px}
.rank .t{display:flex;gap:10px;font-size:14px}
.rank .t span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .t span:last-child{color:var(--muted);flex:0 0 auto}
.rank .track{height:8px;background:var(--paper);border-radius:4px;overflow:hidden}
.rank .track > i{display:block;height:100%;background:var(--primary)}

/* ---------- หน้าเอกสาร (wizard) ---------- */
#editor{position:fixed;inset:0;background:var(--paper);z-index:20;display:flex;flex-direction:column}
.ed-top{background:var(--surface);border-bottom:1px solid var(--line);padding:10px var(--sp);
  display:flex;align-items:center;gap:10px;flex:0 0 auto}
.ed-top .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ed-top .t b{font-size:16px;font-weight:600}
.ed-top .t small{font-size:12px;color:var(--muted)}
.ed-steps{background:var(--surface);border-bottom:1px solid var(--line);padding:12px var(--sp) 14px;
  display:flex;flex-direction:column;gap:10px;flex:0 0 auto}
.steprow{display:flex;gap:6px}
.steprow button{flex:1;min-width:0;border:0;padding:0;background:transparent;cursor:pointer;
  display:flex;flex-direction:column;gap:5px;min-height:auto}
.steprow i{display:block;height:5px;border-radius:3px;background:var(--line-soft)}
.steprow button[data-on="1"] i{background:var(--primary)}
.steprow button[data-done="1"] i{background:var(--done)}
.steprow span{font-size:11px;color:var(--muted);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steprow button[data-on="1"] span{color:var(--ink)}
.ed-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ed-h b{font-size:18px;font-weight:600}
.ed-h small{font-size:13px;color:var(--muted);flex:0 0 auto}
.remain{font-size:13px;color:var(--wait);min-height:20px}
.ed-body{flex:1;min-height:0;overflow-y:auto;padding:var(--sp);display:flex;flex-direction:column;gap:12px}
.ed-foot{background:var(--surface);border-top:1px solid var(--line);padding:12px var(--sp) 16px;
  display:flex;flex-direction:column;gap:10px;flex:0 0 auto}
.ed-foot .row{display:flex;gap:10px}
.ed-foot .row .btn{flex:1;min-height:48px;font-size:16px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;
  display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);line-height:1.5}

/* ---------- ช่องรูป ---------- */
.slots{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.slots.one{grid-template-columns:1fr}
.slot{display:flex;flex-direction:column;gap:6px}
.slot > button{cursor:pointer;padding:0;height:150px;border-radius:var(--r);position:relative;overflow:hidden;
  background:#f7f9fa;border:1px dashed var(--line);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;width:100%;color:var(--primary);font-weight:500}
.slot > button.filled{border-style:solid;background:#d5dce2}
.slot > button:disabled{cursor:default;color:var(--muted)}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .ok{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:12px;background:var(--done);
  display:grid;place-items:center;z-index:2}
.slot .up{position:absolute;inset:0;background:rgba(20,32,44,.58);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;color:#fff;font-size:12px;z-index:2}
.slot .up .track{width:70%;height:6px;border-radius:3px;background:rgba(255,255,255,.35);overflow:hidden}
.slot .up .track > i{display:block;height:100%;background:#fff;transition:width .2s}
.slot .cap{font-size:13px;font-weight:500;line-height:1.4}
.slot .rm{position:absolute;top:8px;left:8px;z-index:2;background:rgba(20,32,44,.82);color:#fff;border:0;
  border-radius:4px;min-height:26px;padding:0 8px;font-size:13px;cursor:pointer}

/* ---------- ตรวจทาน ---------- */
.steplink{text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 14px;display:flex;align-items:center;gap:12px;min-height:60px;width:100%;font:inherit;color:inherit}
.steplink:hover{border-color:var(--primary)}
.steplink .mk{width:30px;height:30px;flex:0 0 auto;border-radius:15px;display:grid;place-items:center;
  font-size:13px;font-weight:600;border:2px solid var(--line);background:var(--surface);color:var(--muted)}
.steplink .mk.done{background:var(--done);border-color:var(--done);color:#fff}
.steplink .tx{flex:1;display:flex;flex-direction:column;gap:2px}
.steplink .tx b{font-size:15px;font-weight:500}
.steplink .tx small{font-size:13px;color:var(--muted)}
.signs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sign{border:1px dashed var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;
  gap:4px;min-height:86px}
.sign.on{border-style:solid;border-color:var(--done)}
.sign .r{font-size:12px;color:var(--muted)}
.sign .nm{font-size:14px;font-weight:500}
.sign .tm{font-size:11px;color:var(--muted)}

/* ---------- ตั้งค่า ---------- */
.section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.section > h3{margin:0;font-size:14px;font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line-soft)}
.section-body{padding:14px;display:flex;flex-direction:column;gap:10px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
th{font-weight:500;color:var(--muted)}
td .btn{margin-right:6px;margin-bottom:4px}

/* ---------- อื่นๆ ---------- */
#lightbox{position:fixed;inset:0;background:rgba(20,32,44,.92);z-index:60;display:grid;place-items:center;padding:20px}
#lightbox img{max-width:100%;max-height:88vh;object-fit:contain}
#lightbox .btn{position:absolute;top:16px;right:16px}
#toast{position:fixed;left:50%;bottom:var(--toast-bottom,24px);transform:translateX(-50%);background:var(--ink);
  color:#fff;padding:10px 18px;border-radius:20px;z-index:80;font-size:14px;max-width:90vw;text-align:center}

@media (min-width:720px){
  .slots{grid-template-columns:repeat(3,1fr)}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .filters{grid-template-columns:repeat(4,1fr)}
  #editor{padding:0}
  .ed-body,.ed-foot,.ed-top,.ed-steps{max-width:820px;margin-inline:auto;width:100%}
}
@media (prefers-reduced-motion:no-preference){
  #editor{animation:slideup .18s ease-out}
  @keyframes slideup{from{transform:translateY(12px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>
<body>

<!-- เข้าสู่ระบบ -->
<div id="login">
  <form class="loginbox" id="loginForm">
    <div>
      <div class="mark"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M4 18V9l8-5 8 5v9"/><path d="M4 18h16"/><path d="M9 18v-5h6v5"/></svg></div>
      <h1>ระบบขายเศษวัสดุเหลือใช้</h1>
      <div class="sub">สำหรับพนักงานและผู้อนุมัติภายใน</div>
    </div>
    <label class="field"><span>ชื่อผู้ใช้</span><input id="u" autocomplete="username" required></label>
    <label class="field"><span>รหัสผ่าน</span><input id="p" type="password" autocomplete="current-password" required></label>
    <div id="loginMsg"></div>
    <button class="btn btn-primary btn-big" id="loginBtn" type="submit">เข้าสู่ระบบ</button>
  </form>
</div>

<!-- หน้าหลัก -->
<div id="app" class="hide">
  <div class="topbar">
    <div class="toprow">
      <div style="flex:1;min-width:0">
        <h1 id="viewTitle">ใบงานขายเศษวัสดุ</h1>
        <div class="sub"><span id="whoName"></span> · <span id="whoRole"></span></div>
      </div>
      <button class="btn btn-icon" id="btnSettings" title="ตั้งค่า" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1A1.7 1.7 0 008.5 19a1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H2a2 2 0 110-4h.1A1.7 1.7 0 003.6 8.5a1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H8a1.7 1.7 0 001-1.5V2a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V8a1.7 1.7 0 001.5 1H22a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
      </button>
      <button class="btn btn-icon" id="btnLogout" title="ออกจากระบบ">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 7V5H5v14h9v-2"/><path d="M11 12h9"/><path d="M17 9l3 3-3 3"/></svg>
      </button>
    </div>
    <div class="seg" id="viewTabs" role="tablist">
      <button type="button" role="tab" data-v="list" aria-selected="true">ใบงาน</button>
      <button type="button" role="tab" data-v="dash" aria-selected="false">แดชบอร์ด</button>
    </div>

    <div id="listFilters">
      <div class="searchrow">
        <div class="search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5d6e7d" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
          <input id="q" placeholder="ค้นหาเลขที่ / ซัพพลายเออร์ / ทะเบียนรถ">
        </div>
        <select id="fYear" aria-label="ปี"></select>
        <select id="fMonth" aria-label="เดือน"></select>
      </div>
      <div class="tabs" id="tabs" role="tablist" style="margin-top:12px"></div>
    </div>

    <div id="dashFilters" class="filters hide">
      <select id="dYear" aria-label="ปี"></select>
      <select id="dMonth" aria-label="เดือน"></select>
      <select id="dCat" aria-label="หมวด"></select>
      <select id="dSup" aria-label="ซัพพลายเออร์"></select>
    </div>
  </div>

  <main id="viewBody"></main>

  <div class="footcreate hide" id="footCreate">
    <button class="btn btn-primary btn-big" id="btnNew">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      สร้างใบงานใหม่
    </button>
  </div>
</div>

<!-- หน้าเอกสาร -->
<div id="editor" class="hide" role="dialog" aria-modal="true" aria-labelledby="edTitle">
  <div class="ed-top">
    <button class="btn btn-icon" id="edClose" style="border:0;background:transparent" title="ย้อนกลับ">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="t"><b id="edTitle"></b><small id="edHint"></small></div>
    <span class="pill" id="edStatus"></span>
  </div>
  <div class="ed-steps" id="edSteps"></div>
  <div class="ed-body" id="edBody"></div>
  <div class="ed-foot" id="edFoot"></div>
</div>
